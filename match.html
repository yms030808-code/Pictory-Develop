  <!-- INTRO SCREEN -->
  <div id="introScreen">

    <!-- Intro copy -->

      <button class="match-start-btn" id="startBtn" type="button">

      </button>
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div class="match-quiz-screen" id="quizScreen">

        <div class="match-progress__fill" id="progressFill" style="width:0%"></div>
      </div>

    </div>
    <div class="match-question" id="questionWrap"></div>
    <div class="match-quiz-nav">
      <button class="match-prev-btn" id="prevBtn" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        이전
      </button>
      <button class="match-next-btn" id="nextBtn" type="button" disabled>
        다음
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div class="match-result-screen" id="resultScreen">
    <div class="match-result-header">

    <div style="text-align:center;">

  (function () {

    const CAMERAS = [

      { id:'ricoh-gr-iiix',      brand:'Ricoh',    model:'GR IIIx',           priceKrw:1590000, priceSummary:'약 1,590,000원', thumbnail:'images/cameras/ricoh-gr-iiix.png',      scores:{ beginner:1,intermediate:3,advanced:3, photo:3,video:1,both:1, portable:3,quality:2,balance:2, noVideo:3,yesVideo:0, budget100:0,budget150:2,budget200:2,budget300:1, complexity:1,shake:1,battery:1,quality_c:2,price:1 }, tags:['초소형','스냅','40mm'] },
      { id:'sony-a7c-ii',        brand:'Sony',     model:'A7C II',            priceKrw:2390000, priceSummary:'약 2,390,000원', thumbnail:'images/cameras/sony-a7c-ii.png',        scores:{ beginner:0,intermediate:2,advanced:3, photo:3,video:3,both:3, portable:2,quality:3,balance:3, noVideo:2,yesVideo:3, budget100:0,budget150:0,budget200:1,budget300:3, complexity:1,shake:2,battery:2,quality_c:3,price:0 }, tags:['풀프레임','올라운더','고화질'] },

      { id:'dji-osmo-pocket-3',  brand:'DJI',      model:'Osmo Pocket 3',     priceKrw: 649000, priceSummary:'약 649,000원',   thumbnail:'images/cameras/dji-osmo-pocket-3.png',  scores:{ beginner:3,intermediate:2,advanced:1, photo:1,video:3,both:2, portable:3,quality:1,balance:1, noVideo:0,yesVideo:3, budget100:3,budget150:1,budget200:0,budget300:0, complexity:3,shake:3,battery:1,quality_c:0,price:3 }, tags:['짐벌','손떨림','포켓'] },
      { id:'sony-a6700',         brand:'Sony',     model:'A6700',             priceKrw:1520000, priceSummary:'약 1,520,000원', thumbnail:'images/cameras/sony-a6700.png',         scores:{ beginner:1,intermediate:3,advanced:3, photo:2,video:3,both:3, portable:2,quality:3,balance:3, noVideo:1,yesVideo:3, budget100:0,budget150:2,budget200:3,budget300:2, complexity:1,shake:2,battery:2,quality_c:3,price:1 }, tags:['APS-C','4K120p','AF추적'] },
      { id:'canon-eos-r50',      brand:'Canon',    model:'EOS R50',           priceKrw: 980000, priceSummary:'약 980,000원',   thumbnail:'images/cameras/canon-eos-r50.png',      scores:{ beginner:3,intermediate:2,advanced:1, photo:2,video:2,both:2, portable:2,quality:1,balance:2, noVideo:2,yesVideo:2, budget100:3,budget150:2,budget200:1,budget300:0, complexity:3,shake:2,battery:2,quality_c:1,price:3 }, tags:['입문','가벼움','무난'] },
      { id:'fujifilm-x-s20',     brand:'Fujifilm', model:'X-S20',             priceKrw:1780000, priceSummary:'약 1,780,000원', thumbnail:'images/cameras/fujifilm-x-s20.png',     scores:{ beginner:2,intermediate:3,advanced:2, photo:2,video:3,both:3, portable:2,quality:2,balance:3, noVideo:1,yesVideo:3, budget100:0,budget150:1,budget200:3,budget300:2, complexity:2,shake:3,battery:3,quality_c:2,price:1 }, tags:['OIS','배터리','영상+사진'] },
      { id:'canon-eos-r50-v',    brand:'Canon',    model:'EOS R50 V',         priceKrw:1180000, priceSummary:'약 1,180,000원', thumbnail:'images/cameras/canon-eos-r50-v.png',    scores:{ beginner:3,intermediate:2,advanced:1, photo:1,video:3,both:2, portable:2,quality:1,balance:2, noVideo:0,yesVideo:3, budget100:1,budget150:3,budget200:2,budget300:0, complexity:3,shake:1,battery:1,quality_c:1,price:2 }, tags:['세로촬영','브이로그','라이브'] },
    ];

    // ── Quiz questions ────────────────────────────
    const QUESTIONS = [
      {
        key: 'experience',
        text: '카메라를 얼마나 써보셨나요?',
        options: [
          { icon:'plant', label:'처음이에요, 잘 모릅니다', value:'beginner' },
          { icon:'camera', label:'몇 번 써본 적 있어요', value:'intermediate' },
          { icon:'crosshair', label:'꽤 익숙하게 다뤄요', value:'advanced' },
        ]
      },
      {
        key: 'purpose',
        text: '주로 어떤 콘텐츠를 만들고 싶으세요?',
        options: [
          { icon:'image', label:'사진 위주로 찍고 싶어요', value:'photo' },
          { icon:'film-strip', label:'영상·브이로그가 메인이에요', value:'video' },
          { icon:'sparkle', label:'사진과 영상 모두 해보고 싶어요', value:'both' },
        ]
      },
      {
        key: 'portability',
        text: '휴대성과 화질, 어느 쪽이 더 중요한가요?',
        options: [
          { icon:'backpack', label:'항상 들고 다닐 수 있어야 해요', value:'portable' },
          { icon:'trophy', label:'화질이 최우선이에요', value:'quality' },
          { icon:'scales', label:'적당히 균형이 맞으면 돼요', value:'balance' },
        ]
      },
      {
        key: 'video',
        text: '영상 촬영 기능이 중요한가요?',
        options: [
          { icon:'check-circle', label:'네, 영상 기능이 있어야 해요', value:'yesVideo' },
          { icon:'camera-slash', label:'아니요, 사진만 찍을 것 같아요', value:'noVideo' },
        ]
      },
      {
        key: 'budget',
        text: '예산은 어느 정도인가요?',
        options: [
          { icon:'coins', label:'100만원 이하', value:'budget100' },
          { icon:'credit-card', label:'100~150만원대', value:'budget150' },
          { icon:'wallet', label:'150~250만원대', value:'budget200' },
          { icon:'bank', label:'250만원 이상도 OK', value:'budget300' },
        ]
      },
      {
        key: 'concern',
        text: '카메라 구매에서 가장 걱정되는 게 뭔가요?',
        options: [
          { icon:'warning-circle', label:'조작이 너무 어려울 것 같아요', value:'complexity' },
          { icon:'person-simple', label:'흔들림이 많이 나올 것 같아요', value:'shake' },
          { icon:'battery-high', label:'배터리가 빨리 닳을 것 같아요', value:'battery' },
          { icon:'aperture', label:'원하는 화질이 안 나올 것 같아요', value:'quality_c' },
          { icon:'tag', label:'가격 대비 만족이 낮을 것 같아요', value:'price' },
        ]
      },
    ];

    let currentQ = 0;
    const answers = {};

    // ── Build camera strip ────────────────────────
    function buildStrip() {
      const strip = document.getElementById('matchStrip');
      const doubled = [...CAMERAS, ...CAMERAS];
      strip.innerHTML = doubled.map(cam => `
        <div class="match-strip-card">
          <img class="match-strip-card__img" src="${cam.thumbnail}" alt="${cam.model}" onerror="this.src='images/cameras/default-camera.png'">
          <p class="match-strip-card__name">${cam.brand} ${cam.model}</p>
        </div>
      `).join('');
    }

    // ── Render question ───────────────────────────
    function renderQuestion() {
      const q = QUESTIONS[currentQ];
      const wrap = document.getElementById('questionWrap');

      document.getElementById('progressFill').style.width = ((currentQ / QUESTIONS.length) * 100) + '%';
      document.getElementById('progressLabel').textContent = (currentQ + 1) + ' / ' + QUESTIONS.length;
      document.getElementById('prevBtn').style.visibility = currentQ === 0 ? 'hidden' : 'visible';

      const isLast = currentQ === QUESTIONS.length - 1;
      const nextBtn = document.getElementById('nextBtn');
      const nextArrow = PictoryIcons.render('arrow-right', { size: 'sm', className: 'match-next-arrow' });
      nextBtn.innerHTML = isLast ? `결과 보기 ${nextArrow}` : `다음 ${nextArrow}`;
      nextBtn.disabled = !answers[q.key];

      wrap.innerHTML = `
        <p class="match-question__num">Q${currentQ + 1}</p>
        <p class="match-question__text">${q.text}</p>
        <div class="match-options">
          ${q.options.map(opt => `
            <button class="match-option ${answers[q.key] === opt.value ? 'is-selected' : ''}"
              data-value="${opt.value}" type="button">
              <span class="match-option__icon" aria-hidden="true">${PictoryIcons.render(opt.icon)}</span>
              ${opt.label}
            </button>
          `).join('')}
        </div>
      `;

      wrap.querySelectorAll('.match-option').forEach(btn => {
        btn.addEventListener('click', () => {
          answers[q.key] = btn.dataset.value;
          wrap.querySelectorAll('.match-option').forEach(b => b.classList.remove('is-selected'));
          btn.classList.add('is-selected');
          document.getElementById('nextBtn').disabled = false;
        });
      });
    }

    // ── Role labels & reason texts ────────────────
    function getRoleLabel(slot, answers) {
      if (slot === 0) {
        const map = { photo: '사진 촬영을 즐기는 분께', video: '영상 크리에이터를 위한', both: '사진·영상 모두 즐기는 분께' };
        return map[answers.purpose] || '촬영을 즐기는 분께';
      }
      if (slot === 1) return '가성비를 중시하는 분께';
      const map = {
        complexity: '조작이 쉬운 카메라를 찾는 분께',
        shake:      '흔들림 없는 촬영을 원하는 분께',
        battery:    '배터리 걱정 없이 찍고 싶은 분께',
        quality_c:  '최고 화질을 원하는 분께',
        price:      '가격 만족도를 높이고 싶은 분께',
      };
      return map[answers.concern] || '특화 기능을 원하는 분께';
    }

    function getReasonText(cam, slot, answers) {
      if (slot === 0) {
        if (answers.purpose === 'video')
          return `${cam.tags.join('·')} 특성이 영상 중심 촬영에 최적화되어 있어요. 자동 AF와 영상 품질 모두 높은 점수를 받았어요.`;
        if (answers.purpose === 'photo')
          return `사진 화질과 색감에서 강점을 보여요. 선택하신 촬영 성향 전반에서 가장 높은 매칭 점수를 기록했어요.`;
        return `촬영 성향 전반을 종합했을 때 가장 높은 매칭 점수를 기록했어요. ${cam.tags.join('·')} 특성이 니즈와 잘 맞아요.`;
      }
      if (slot === 1)
        return `${cam.priceSummary} 가격대에서 성능 대비 만족도가 가장 높아요. 예산을 효율적으로 쓰고 싶은 분께 최우선으로 추천드려요.`;
      const map = {
        complexity: '직관적인 조작법과 자동 모드가 잘 갖춰져 있어 처음 써도 금방 적응할 수 있어요.',
        shake:      '강력한 손떨림 보정(OIS/IBIS)이 탑재되어 있어 흔들림 걱정 없이 촬영할 수 있어요.',
        battery:    '동급 최장 배터리 지속력으로 하루 종일 찍어도 걱정이 없어요.',
        quality_c:  '대형 센서와 뛰어난 화질로 원하는 결과물을 정확히 뽑아내 줄 거예요.',
        price:      `${cam.priceSummary}으로 기능 대비 가격 만족도가 매우 높아 구매 후 후회가 적은 선택이에요.`,
      };
      return map[answers.concern] || `${cam.tags.join('·')} 특성이 선택하신 니즈와 잘 맞아 대안으로 추천드려요.`;
    }

    // ── Calculate top 3 with distinct roles ──────
    function calcTop3() {
      const scored = CAMERAS.map(cam => {
        let score = 0;
        Object.values(answers).forEach(val => {
          if (cam.scores[val] !== undefined) score += cam.scores[val];
        });
        return { ...cam, score };
      }).sort((a, b) => b.score - a.score);

      // Slot 0: best overall
      const best = scored[0];
      const rest1 = scored.filter(c => c.id !== best.id);

      // Slot 1: best value (score / price ratio)
      const valuePick = [...rest1].sort((a, b) =>
        (b.score / b.priceKrw) - (a.score / a.priceKrw)
      )[0];
      const rest2 = rest1.filter(c => c.id !== valuePick.id);

      // Slot 2: best for concern / portability
      const concernKey = answers.concern || 'balance';
      const portKey = answers.portability || 'balance';
      const specialPick = [...rest2].sort((a, b) => {
        const sa = (a.scores[concernKey] || 0) + (a.scores[portKey] || 0);
        const sb = (b.scores[concernKey] || 0) + (b.scores[portKey] || 0);
        return sb - sa;
      })[0];

      return [
        { ...best,        role: getRoleLabel(0, answers), reason: getReasonText(best,        0, answers) },
        { ...valuePick,   role: getRoleLabel(1, answers), reason: getReasonText(valuePick,   1, answers) },
        { ...specialPick, role: getRoleLabel(2, answers), reason: getReasonText(specialPick, 2, answers) },
      ];
    }

    // ── Render results ────────────────────────────
    function renderResults() {
      const top3 = calcTop3();
      const grid = document.getElementById('resultGrid');

      grid.innerHTML = top3.map((cam, i) => `
        <div class="match-result-card ${i === 0 ? 'match-result-card--top' : ''}">
          <span class="match-result-card__rank match-result-card__rank--${i+1}">${i+1}</span>
          <div class="match-result-card__thumb">
            <img src="${cam.thumbnail}" alt="${cam.model}" onerror="this.src='images/cameras/default-camera.png'">
          </div>
          <div class="match-result-card__body">
            <p class="match-result-card__role">${cam.role}</p>
            <p class="match-result-card__brand">${cam.brand}</p>
            <p class="match-result-card__model">${cam.model}</p>
            <div class="match-result-card__tags">
              ${cam.tags.map(t => `<span class="match-result-card__tag">${t}</span>`).join('')}
            </div>
            <p class="match-result-card__price">${cam.priceSummary}</p>
            <p class="match-result-card__reason">${cam.reason}</p>
            <div style="display:flex;gap:8px;margin-top:12px;">
              <a href="price.html?q=${encodeURIComponent(cam.brand + ' ' + cam.model)}"
                 class="btn btn--ghost" style="flex:1;font-size:0.78rem;padding:8px 10px;">상세보기</a>
              <button class="cam-add-compare-btn product-card__compare-btn" data-id="${cam.id}" type="button"
                style="flex:1;font-size:0.78rem;padding:8px 10px;">
                + 비교함 담기
              </button>
            </div>
          </div>
        </div>
      `).join('');

      grid.querySelectorAll('.cam-add-compare-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          const cam = CAMERAS.find(c => c.id === id);
          if (!cam || !window.PicoryCompare) return;
          if (window.PicoryCompare.has(id)) { btn.textContent = '✓ 담김'; btn.classList.add('is-added'); return; }
          const added = window.PicoryCompare.add(cam);
          if (added) {
            btn.textContent = '✓ 담김';
            btn.classList.add('is-added');
          } else {
            btn.textContent = '이미 담김';
            setTimeout(() => { btn.textContent = '+ 비교함 담기'; btn.classList.remove('is-added'); }, 1500);
          }
        });
      });
    }

    // ── Screen transitions ────────────────────────
    function showQuiz() {
      document.getElementById('introScreen').style.display = 'none';
      document.getElementById('quizScreen').classList.add('is-active');
      renderQuestion();
    }

    function showResults() {
      document.getElementById('quizScreen').classList.remove('is-active');
      document.getElementById('resultScreen').classList.add('is-active');
      document.getElementById('pageFooter').style.display = '';
      document.getElementById('progressFill').style.width = '100%';
      renderResults();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function reset() {
      currentQ = 0;
      Object.keys(answers).forEach(k => delete answers[k]);
      document.getElementById('resultScreen').classList.remove('is-active');
      document.getElementById('pageFooter').style.display = 'none';
      document.getElementById('introScreen').style.display = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ── Event listeners ───────────────────────────
    document.getElementById('startBtn').addEventListener('click', showQuiz);

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentQ < QUESTIONS.length - 1) {
        currentQ++;
        renderQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        showResults();
      }
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentQ > 0) {
        currentQ--;
        renderQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    document.getElementById('retryBtn').addEventListener('click', reset);

    buildStrip();
  })();
  </script>
</body>
</html>
