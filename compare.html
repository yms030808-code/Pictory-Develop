  <script>
  (function () {
    /* ── Camera catalogue (same data as search.html / match.html) ── */
    var CAMERAS = [
      { id: 'fujifilm-x100vi', brand: 'Fujifilm', model: 'X100VI', priceKrw: 2190000, priceSummary: '약 219만원대', thumbnail: 'images/cameras/fujifilm-x100vi.png', sensor: 'APS-C 26.1MP', video: '6.2K / 4K', weight: '521g', battery: '약 450컷', af: '위상차 + 딥러닝 AF', ois: '○', size: '컴팩트' },
      { id: 'canon-eos-r10', brand: 'Canon', model: 'EOS R10', priceKrw: 920000, priceSummary: '약 92만원대~', thumbnail: 'images/cameras/canon-eos-r10.png', sensor: 'APS-C 24.2MP', video: '4K / FHD', weight: '382g', battery: '약 430컷', af: '듀얼픽셀 CMOS AF II', ois: '△ (렌즈)', size: '소형' },
      { id: 'sony-zv-e10-ii', brand: 'Sony', model: 'ZV-E10 II', priceKrw: 1280000, priceSummary: '약 128만원대~', thumbnail: 'images/cameras/sony-zv-e10-ii.png', sensor: 'APS-C 26MP', video: '4K / FHD', weight: '292g (바디)', battery: '약 570컷', af: '위상차 AI AF', ois: '△ (렌즈)', size: '초소형' },
      { id: 'ricoh-gr-iiix', brand: 'Ricoh', model: 'GR IIIx', priceKrw: 1590000, priceSummary: '약 159만원대~', thumbnail: 'images/cameras/ricoh-gr-iiix.png', sensor: 'APS-C 24.2MP', video: 'FHD', weight: '262g', battery: '약 200컷', af: '위상차 PDAF', ois: '○ (센서)', size: '포켓' },
      { id: 'sony-a7c-ii', brand: 'Sony', model: 'A7C II', priceKrw: 2390000, priceSummary: '약 239만원대~', thumbnail: 'images/cameras/sony-a7c-ii.png', sensor: '풀프레임 33MP', video: '4K / FHD', weight: '514g', battery: '약 530컷', af: 'AI AF (위상차)', ois: '○ (센서)', size: '소형 풀프레임' },
      { id: 'nikon-z-fc', brand: 'Nikon', model: 'Z fc', priceKrw: 1190000, priceSummary: '약 119만원대~', thumbnail: 'images/cameras/nikon-z-fc.png', sensor: 'APS-C 20.9MP', video: '4K / FHD', weight: '390g', battery: '약 300컷', af: '위상차 하이브리드 AF', ois: '△ (렌즈)', size: '소형' },
      { id: 'canon-g7x-mark-iii', brand: 'Canon', model: 'G7X Mark III', priceKrw: 950000, priceSummary: '약 95만원대~', thumbnail: 'images/cameras/canon-g7x-mark-iii.png', sensor: '1인치 20.1MP', video: '4K / FHD', weight: '304g', battery: '약 235컷', af: '듀얼픽셀 CMOS AF', ois: '○ (광학)', size: '컴팩트' },
      { id: 'dji-osmo-pocket-3', brand: 'DJI', model: 'Osmo Pocket 3', priceKrw: 649000, priceSummary: '약 65만원대~', thumbnail: 'images/cameras/dji-osmo-pocket-3.png', sensor: '1인치 20MP', video: '4K 120fps', weight: '179g', battery: '약 116분', af: 'PDAF + 얼굴추적', ois: '○ (짐벌 3축)', size: '초소형' },
      { id: 'sony-a6700', brand: 'Sony', model: 'A6700', priceKrw: 1520000, priceSummary: '약 152만원대~', thumbnail: 'images/cameras/sony-a6700.png', sensor: 'APS-C 26MP', video: '4K 120p / FHD', weight: '493g', battery: '약 570컷', af: 'AI AF (위상차)', ois: '○ (센서)', size: '소형' },
      { id: 'canon-eos-r50', brand: 'Canon', model: 'EOS R50', priceKrw: 980000, priceSummary: '약 98만원대~', thumbnail: 'images/cameras/canon-eos-r50.png', sensor: 'APS-C 24.2MP', video: '4K / FHD', weight: '375g', battery: '약 390컷', af: '듀얼픽셀 CMOS AF II', ois: '△ (렌즈)', size: '소형' },
      { id: 'fujifilm-x-s20', brand: 'Fujifilm', model: 'X-S20', priceKrw: 1780000, priceSummary: '약 178만원대~', thumbnail: 'images/cameras/fujifilm-x-s20.png', sensor: 'APS-C 26.1MP', video: '6.2K / 4K', weight: '491g', battery: '약 750컷', af: '위상차 AF', ois: '○ (센서)', size: '소형' },
      { id: 'canon-eos-r50-v', brand: 'Canon', model: 'EOS R50 V', priceKrw: 1180000, priceSummary: '약 118만원대~', thumbnail: 'images/cameras/canon-eos-r50-v.png', sensor: 'APS-C 24.2MP', video: '4K / FHD', weight: '390g', battery: '약 390컷', af: '듀얼픽셀 CMOS AF II', ois: '△ (렌즈)', size: '소형' },
    ];

    var SPEC_ROWS = [
      { label: '센서 / 화소', key: 'sensor' },
      { label: '영상', key: 'video' },
      { label: '무게', key: 'weight' },
      { label: '배터리', key: 'battery' },
      { label: 'AF 방식', key: 'af' },
      { label: '손떨방(OIS)', key: 'ois' },
      { label: '크기 분류', key: 'size' },
      { label: '가격대', key: 'priceSummary' },
    ];

    var visibleIds = [];

    function uniqueIds(ids) {
      var seen = {};
      return ids.filter(function(id) {
        if (seen[id]) return false;
        seen[id] = true;
        return true;
      });
    }

    function getCamerasToCompare() {
      var params = new URLSearchParams(location.search);
      var ids = uniqueIds((params.get('ids') || '').split(',').filter(Boolean));
      if (!ids.length) {
        try {
          var stored = JSON.parse(localStorage.getItem('picory-compare-v1')) || [];
          ids = uniqueIds(stored.map(function(c){ return c.id; }));
        } catch(e){}
      }
      return ids.map(function(id){ return CAMERAS.find(function(c){ return c.id === id; }); }).filter(Boolean);
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatPrice(n) {
      return n ? n.toLocaleString('ko-KR') + '원' : '-';
    }

    function syncVisibleIds(cams) {
      var available = cams.map(function(c){ return c.id; });
      visibleIds = visibleIds.filter(function(id){ return available.indexOf(id) !== -1; });
      if (!visibleIds.length) visibleIds = available.slice(0, 3);
      if (visibleIds.length > 3) visibleIds = visibleIds.slice(0, 3);
      return visibleIds;
    }

    function updateUrl(cams) {
      var ids = cams.map(function(c){ return c.id; }).join(',');
      history.replaceState(null, '', ids ? '?ids=' + encodeURIComponent(ids).replace(/%2C/g, ',') : location.pathname);
    }

    function renderPicker(cams) {
      var picker = document.getElementById('cmpPicker');
      var list = document.getElementById('cmpPickerList');
      if (!picker || !list) return;
      picker.classList.toggle('hidden', cams.length <= 3);
      if (cams.length <= 3) {
        list.innerHTML = '';
        return;
      }
      list.innerHTML = cams.map(function(cam) {
        var active = visibleIds.indexOf(cam.id) !== -1;
        return '<button type="button" class="cmp-picker__option' + (active ? ' is-active' : '') + '" data-cid="' + escapeHtml(cam.id) + '" aria-pressed="' + (active ? 'true' : 'false') + '">' +
          escapeHtml(cam.brand + ' ' + cam.model) +
        '</button>';
      }).join('');
      list.querySelectorAll('.cmp-picker__option').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var id = btn.getAttribute('data-cid');
          var isActive = visibleIds.indexOf(id) !== -1;
          if (isActive) {
            if (visibleIds.length > 1) visibleIds = visibleIds.filter(function(v){ return v !== id; });
          } else {
            if (visibleIds.length >= 3) visibleIds.shift();
            visibleIds.push(id);
          }
          render();
        });
      });
    }

    function render() {
      var allCams = getCamerasToCompare();
      var errorEl = document.getElementById('cmpError');
      var contentEl = document.getElementById('cmpContent');
      if (!allCams.length) {
        errorEl.classList.remove('hidden');
        contentEl.style.display = 'none';
        return;
      }
      errorEl.classList.add('hidden');
      contentEl.style.display = '';
      syncVisibleIds(allCams);
      renderPicker(allCams);
      var cams = visibleIds.map(function(id) {
        return allCams.find(function(c){ return c.id === id; });
      }).filter(Boolean);

      /* ── Header cards ── */
      var cardsHtml = cams.map(function(cam) {
        var detailHref = 'price.html?q=' + encodeURIComponent(cam.brand + ' ' + cam.model);
        return '<div class="cmp-card">' +
          '<div class="cmp-card__img">' +
            '<img src="' + escapeHtml(cam.thumbnail) + '" alt="' + escapeHtml(cam.model) + '" onerror="this.style.display=\'none\'">' +
          '</div>' +
          '<div class="cmp-card__body">' +
            '<span class="cmp-card__brand">' + escapeHtml(cam.brand) + '</span>' +
            '<strong class="cmp-card__model">' + escapeHtml(cam.model) + '</strong>' +
            '<span class="cmp-card__price">' + formatPrice(cam.priceKrw) + '</span>' +
            '<a class="cmp-card__detail-link" href="' + escapeHtml(detailHref) + '">상세보기 →</a>' +
          '</div>' +
          '<button class="cmp-card__remove" data-cid="' + escapeHtml(cam.id) + '" type="button" aria-label="' + escapeHtml(cam.model) + ' 제거">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
          '</button>' +
        '</div>';
      }).join('');

      /* Empty slot placeholders */
      for (var i = cams.length; i < 3; i++) {
        cardsHtml += '<div class="cmp-card cmp-card--empty">' +
          '<div class="cmp-card__add">' +
            '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>' +
            '<span>카메라 추가</span>' +
          '</div>' +
        '</div>';
      }
      document.getElementById('cmpCards').innerHTML = cardsHtml;

      /* Remove buttons */
      document.querySelectorAll('.cmp-card__remove').forEach(function(btn) {
        btn.addEventListener('click', function() {
          if (window.PicoryCompare) window.PicoryCompare.remove(btn.dataset.cid);
          var newCams = allCams.filter(function(c){ return c.id !== btn.dataset.cid; });
          visibleIds = visibleIds.filter(function(id){ return id !== btn.dataset.cid; });
          updateUrl(newCams);
          render();
        });
      });

      /* ── Spec table ── */
      var theadHtml = '<tr><th class="cmp-th-label"></th>' +
        cams.map(function(c){ return '<th>' + escapeHtml(c.brand) + '<br><span class="cmp-th-model">' + escapeHtml(c.model) + '</span></th>'; }).join('') +
        '</tr>';
      document.getElementById('cmpThead').innerHTML = theadHtml;

      var tbodyHtml = SPEC_ROWS.map(function(row) {
        var cells = cams.map(function(c){ return '<td>' + escapeHtml(c[row.key] || '-') + '</td>'; }).join('');
        return '<tr><td class="cmp-td-label">' + escapeHtml(row.label) + '</td>' + cells + '</tr>';
      }).join('');
      document.getElementById('cmpTbody').innerHTML = tbodyHtml;
    }

    document.addEventListener('DOMContentLoaded', render);
  })();
  </script>
